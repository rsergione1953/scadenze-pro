<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scadenze Pro — Gestione Intelligente</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 950px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent-blue); display: flex; align-items: center; gap: 10px; }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .num { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }
        .stat-card.urgent .num { color: var(--accent-yellow); }
        .stat-card.expired .num { color: var(--accent-red); }
        .stat-card.money .num { color: var(--accent-green); }

        .main-content {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .form-card, .list-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent-blue); }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 5px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }

        .btn-sec {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            margin-top: 10px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-chip {
            padding: 6px 14px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-chip.active {
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: bold;
        }

        .item-list { list-style: none; }

        .item-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-blue);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }

        .item-card:hover { transform: translateX(3px); }
        .item-card.warning { border-left-color: var(--accent-yellow); }
        .item-card.danger { border-left-color: var(--accent-red); }

        .item-title { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        .item-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
        
        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .price-tag {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 0.95rem;
            margin-left: 5px;
        }

        .actions { display: flex; gap: 8px; }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
        }
        .action-btn:hover { color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⏰ Scadenze Pro</h1>
        <button class="btn btn-sec" style="width: auto; padding: 6px 12px;" onclick="chiediPermessoNotifiche()">🔔 Attiva Notifiche</button>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div>Totali</div>
            <div class="num" id="count-total">0</div>
        </div>
        <div class="stat-card urgent">
            <div>In Scadenza (≤3 gg)</div>
            <div class="num" id="count-urgent">0</div>
        </div>
        <div class="stat-card expired">
            <div>Scadute</div>
            <div class="num" id="count-expired">0</div>
        </div>
        <div class="stat-card money">
            <div>Totale Spese</div>
            <div class="num" id="total-money">€ 0.00</div>
        </div>
    </div>

    <div class="main-content">
        <!-- Form Inserimento -->
        <div class="form-card">
            <h3 style="margin-bottom: 15px;">Nuovo Promemoria</h3>
            <form id="scadenza-form">
                <div class="form-group">
                    <label for="titolo">Titolo / Descrizione</label>
                    <input type="text" id="titolo" required placeholder="Es. Prendere antibiotico, Affitto...">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data Scadenza</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="ora">Ora (Opzionale)</label>
                        <input type="time" id="ora">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="importo">Importo € (Opz.)</label>
                        <input type="number" step="0.01" id="importo" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="Salute">💊 Salute / Medicina</option>
                            <option value="Casa">🏠 Casa / Affitto</option>
                            <option value="Bollette">⚡ Bollette / Utenze</option>
                            <option value="Veicoli">🚗 Auto / Veicoli</option>
                            <option value="Altro">📌 Altro</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn">Salva Promemoria</button>
            </form>
            <hr style="margin: 15px 0; border-color: var(--border-color);">
            <button class="btn btn-sec" onclick="esportaDati()">💾 Esporta JSON</button>
        </div>

        <!-- Lista e Filtri -->
        <div class="list-card">
            <div class="filter-bar">
                <button class="filter-chip active" onclick="filtra('tutti', this)">Tutti</button>
                <button class="filter-chip" onclick="filtra('Salute', this)">💊 Salute</button>
                <button class="filter-chip" onclick="filtra('Casa', this)">🏠 Casa/Affitto</button>
                <button class="filter-chip" onclick="filtra('urgenti', this)">⚠️ In Scadenza</button>
            </div>
            <ul class="item-list" id="scadenze-list"></ul>
        </div>
    </div>
</div>

<script>
    let scadenze = JSON.parse(localStorage.getItem('scadenze_db')) || [];
    let filtroCorrente = 'tutti';

    document.addEventListener('DOMContentLoaded', () => {
        render();
        verificaAllarmi();
    });

    document.getElementById('scadenza-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const nuovo = {
            id: Date.now(),
            titolo: document.getElementById('titolo').value,
            data: document.getElementById('data').value,
            ora: document.getElementById('ora').value || '',
            importo: parseFloat(document.getElementById('importo').value) || 0,
            categoria: document.getElementById('categoria').value
        };
        scadenze.push(nuovo);
        salva();
        e.target.reset();
        render();
        verificaAllarmi();
    });

    function salva() {
        localStorage.setItem('scadenze_db', JSON.stringify(scadenze));
    }

    function elimina(id) {
        scadenze = scadenze.filter(item => item.id !== id);
        salva();
        render();
    }

    function calcolaGiorni(dataStr) {
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);
        const target = new Date(dataStr);
        const diff = target - oggi;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function render() {
        const listaEl = document.getElementById('scadenze-list');
        listaEl.innerHTML = '';

        let countUrgent = 0, countExpired = 0, totaleImporti = 0;

        scadenze.sort((a, b) => new Date(a.data + (a.ora ? 'T' + a.ora : '')) - new Date(b.data + (b.ora ? 'T' + b.ora : '')));

        scadenze.forEach(item => {
            const giorni = calcolaGiorni(item.data);
            if (giorni <= 3 && giorni >= 0) countUrgent++;
            if (giorni < 0) countExpired++;
            if (item.importo) totaleImporti += item.importo;

            // Filtri
            if (filtroCorrente === 'urgenti' && (giorni > 3 || giorni < 0)) return;
            if (filtroCorrente === 'scaduti' && giorni >= 0) return;
            if (['Salute', 'Casa', 'Bollette', 'Veicoli'].includes(filtroCorrente) && item.categoria !== filtroCorrente) return;

            let statusClass = '', statusText = `${giorni} gg rimasti`;
            if (giorni < 0) { statusClass = 'danger'; statusText = `Scaduto (${Math.abs(giorni)} gg fa)`; }
            else if (giorni <= 3) { statusClass = 'warning'; statusText = giorni === 0 ? 'OGGI!' : `Scade in ${giorni} gg`; }

            const oraTesto = item.ora ? ` 🕒 ${item.ora}` : '';
            const importoTesto = item.importo > 0 ? `<span class="price-tag">€ ${item.importo.toFixed(2)}</span>` : '';

            const li = document.createElement('li');
            li.className = `item-card ${statusClass}`;
            li.innerHTML = `
                <div>
                    <div class="item-title">${item.titolo} ${importoTesto}</div>
                    <div class="item-meta">
                        <span class="badge">${item.categoria}</span> • 📅 ${item.data}${oraTesto} — <strong>${statusText}</strong>
                    </div>
                </div>
                <div class="actions">
                    <button class="action-btn" onclick="elimina(${item.id})">🗑️</button>
                </div>
            `;
            listaEl.appendChild(li);
        });

        document.getElementById('count-total').innerText = scadenze.length;
        document.getElementById('count-urgent').innerText = countUrgent;
        document.getElementById('count-expired').innerText = countExpired;
        document.getElementById('total-money').innerText = `€ ${totaleImporti.toFixed(2)}`;
    }

    function filtra(tipo, btn) {
        filtroCorrente = tipo;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function chiediPermessoNotifiche() {
        if ("Notification" in window) {
            Notification.requestPermission().then(p => {
                if (p === "granted") alert("Notifiche attivate!");
            });
        }
    }

    function verificaAllarmi() {
        scadenze.forEach(item => {
            const giorni = calcolaGiorni(item.data);
            if (giorni >= 0 && giorni <= 1) {
                // Allarme Parlato
                if ('speechSynthesis' in window) {
                    const oraInfo = item.ora ? ` alle ore ${item.ora}` : '';
                    const msg = new SpeechSynthesisUtterance(`Promemoria: ${item.titolo}${oraInfo}.`);
                    msg.lang = 'it-IT';
                    window.speechSynthesis.speak(msg);
                }
                // Notifica Push
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("⏰ Promemoria Imminente!", {
                        body: `${item.titolo} - ${giorni === 0 ? 'OGGI' : 'domani'}${item.ora ? ' alle ' + item.ora : ''}!`,
                    });
                }
            }
        });
    }

    function esportaDati() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scadenze));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "scadenze_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>
</body>
</html>
