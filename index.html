<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scadenze Pro Mobile</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div class="container">
    <header>
        <h1>⏰ Scadenze Pro</h1>
        <button class="btn btn-sec" style="width: auto;" onclick="chiediPermessoNotifiche()">🔔 Notifiche</button>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <div>Totali</div>
            <div class="num" id="count-total">0</div>
        </div>
        <div class="stat-card urgent">
            <div>In Scadenza</div>
            <div class="num" id="count-urgent">0</div>
        </div>
        <div class="stat-card expired">
            <div>Scadute</div>
            <div class="num" id="count-expired">0</div>
        </div>
        <div class="stat-card money">
            <div>Spese</div>
            <div class="num" id="total-money">€ 0</div>
        </div>
    </div>

    <div class="main-content">
        <div class="form-card">
            <h3>Nuovo Promemoria</h3>
            <form id="scadenza-form">
                <div class="form-group">
                    <label for="titolo">Descrizione</label>
                    <input type="text" id="titolo" required placeholder="Es. Medicina, Affitto...">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="ora">Ora</label>
                        <input type="time" id="ora">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="importo">€ (Opz.)</label>
                        <input type="number" step="0.01" id="importo" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="Salute">💊 Salute</option>
                            <option value="Casa">🏠 Casa</option>
                            <option value="Bollette">⚡ Bollette</option>
                            <option value="Veicoli">🚗 Auto</option>
                            <option value="Altro">📌 Altro</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn">Salva Promemoria</button>
            </form>
            
            <!-- Gestione Backup e File -->
            <button class="btn btn-sec" onclick="esportaDati()">💾 Esporta Backup JSON</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="caricaFileBackup(event)">
            <button class="btn btn-sec" onclick="document.getElementById('importFile').click()">📂 Importa Backup JSON</button>
            <button class="btn btn-sec" onclick="esportaCSV()">📊 Esporta in CSV (Excel)</button>
        </div>

        <div class="list-card">
            <div class="filter-bar">
                <button class="filter-chip active" onclick="filtra('tutti', this)">Tutti</button>
                <button class="filter-chip" onclick="filtra('Salute', this)">💊 Salute</button>
                <button class="filter-chip" onclick="filtra('Casa', this)">🏠 Casa</button>
                <button class="filter-chip" onclick="filtra('urgenti', this)">⚠️ Urgenti</button>
            </div>
            <ul class="item-list" id="scadenze-list"></ul>
        </div>
    </div>
</div>

<script>
    let scadenze = JSON.parse(localStorage.getItem('scadenze_db')) || [];
    let filtroCorrente = 'tutti';

    const TELEGRAM_TOKEN = 'INSERISCI_QUI_IL_TUO_TOKEN';
    const TELEGRAM_CHAT_ID = 'INSERISCI_QUI_IL_TUO_CHAT_ID';

    document.addEventListener('DOMContentLoaded', () => {
        render();
        verificaAllarmi();
    });

    document.getElementById('scadenza-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const nuovo = {
            id: Date.now(),
            titolo: document.getElementById('titolo').value,
            data: document.getElementById('data').value,
            ora: document.getElementById('ora').value || '',
            importo: parseFloat(document.getElementById('importo').value) || 0,
            categoria: document.getElementById('categoria').value
        };
        scadenze.push(nuovo);
        salva();
        e.target.reset();
        render();
        verificaAllarmi();
    });

    function salva() {
        localStorage.setItem('scadenze_db', JSON.stringify(scadenze));
    }

    function elimina(id) {
        scadenze = scadenze.filter(item => item.id !== id);
        salva();
        render();
    }

    function calcolaGiorni(dataStr) {
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);
        const target = new Date(dataStr);
        const diff = target - oggi;
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function render() {
        const listaEl = document.getElementById('scadenze-list');
        listaEl.innerHTML = '';

        let countUrgent = 0, countExpired = 0, totaleImporti = 0;

        scadenze.sort((a, b) => new Date(a.data + (a.ora ? 'T' + a.ora : '')) - new Date(b.data + (b.ora ? 'T' + b.ora : '')));

        scadenze.forEach(item => {
            const giorni = calcolaGiorni(item.data);
            if (giorni <= 3 && giorni >= 0) countUrgent++;
            if (giorni < 0) countExpired++;
            if (item.importo) totaleImporti += item.importo;

            if (filtroCorrente === 'urgenti' && (giorni > 3 || giorni < 0)) return;
            if (filtroCorrente === 'scaduti' && giorni >= 0) return;
            if (['Salute', 'Casa', 'Bollette', 'Veicoli'].includes(filtroCorrente) && item.categoria !== filtroCorrente) return;

            let statusClass = '', statusText = `${giorni}g rimasti`;
            if (giorni < 0) { statusClass = 'danger'; statusText = `Scaduto (${Math.abs(giorni)}g fa)`; }
            else if (giorni <= 3) { statusClass = 'warning'; statusText = giorni === 0 ? 'OGGI!' : `${giorni}g rimasti`; }

            const oraTesto = item.ora ? ` 🕒${item.ora}` : '';
            const importoTesto = item.importo > 0 ? `<span class="price-tag">€${item.importo.toFixed(2)}</span>` : '';

            const li = document.createElement('li');
            li.className = `item-card ${statusClass}`;
            li.innerHTML = `
                <div class="item-details">
                    <div class="item-title">${item.titolo} ${importoTesto}</div>
                    <div class="item-meta">
                        <span class="badge">${item.categoria}</span> • 📅${item.data}${oraTesto} — <strong>${statusText}</strong>
                    </div>
                </div>
                <div class="actions">
                    <button class="action-btn" onclick="elimina(${item.id})">🗑️</button>
                </div>
            `;
            listaEl.appendChild(li);
        });

        document.getElementById('count-total').innerText = scadenze.length;
        document.getElementById('count-urgent').innerText = countUrgent;
        document.getElementById('count-expired').innerText = countExpired;
        document.getElementById('total-money').innerText = `€ ${totaleImporti.toFixed(0)}`;
    }

    function filtra(tipo, btn) {
        filtroCorrente = tipo;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function chiediPermessoNotifiche() {
        if ("Notification" in window) {
            Notification.requestPermission().then(p => {
                if (p === "granted") alert("Notifiche attivate!");
            });
        }
    }

    function inviaNotificaTelegram(messaggio) {
        if (TELEGRAM_TOKEN === 'INSERISCI_QUI_IL_TUO_TOKEN') return;
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: messaggio, parse_mode: 'HTML' })
        }).catch(err => console.error(err));
    }

    function verificaAllarmi() {
        scadenze.forEach(item => {
            const giorni = calcolaGiorni(item.data);
            if (giorni >= 0 && giorni <= 1) {
                const quando = giorni === 0 ? 'OGGI' : 'DOMANI';
                const testo = `⏰ PROMEMORIA: ${item.titolo} scade ${quando}!`;
                inviaNotificaTelegram(testo);
            }
        });
    }

    /* Esportazione JSON */
    function esportaDati() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(scadenze));
        scaricaFile(dataStr, "scadenze_backup.json");
    }

    /* Importazione JSON da Drive o file locale */
    function caricaFileBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const datiCaricati = JSON.parse(e.target.result);
                if (Array.isArray(datiCaricati)) {
                    scadenze = datiCaricati;
                    salva();
                    render();
                    alert("Dati aggiornati correttamente sullo smartphone!");
                } else {
                    alert("Il file non contiene un formato valido di scadenze.");
                }
            } catch (err) {
                alert("Errore nella lettura del file.");
            }
        };
        reader.readAsText(file);
    }

    /* Esportazione CSV */
    function esportaCSV() {
        if (scadenze.length === 0) {
            alert("Nessun dato da esportare!");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Descrizione,Data,Ora,Importo,Categoria\n";

        scadenze.forEach(item => {
            const riga = `"${item.titolo}","${item.data}","${item.ora || ''}","${item.importo || 0}","${item.categoria}"`;
            csvContent += riga + "\n";
        });

        scaricaFile(csvContent, "scadenze_export.csv");
    }

    function scaricaFile(contenuto, nomeFile) {
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", contenuto);
        downloadAnchor.setAttribute("download", nomeFile);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>
</body>
</html>
